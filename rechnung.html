<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Rechnung · Rechtsanwalt Donnerfaust</title><link rel="stylesheet" href="./style.css?v=13"><style>body{background:#f3f4f6}.shared-invoice{max-width:820px;margin:30px auto;padding:24px}.shared-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start}.shared-title{font-size:30px;margin:0 0 6px}.shared-meta{color:#667085}.shared-recipient{margin:20px 0;padding:16px;border:1px solid #dfe3ea;border-radius:14px;background:#f8fafc}.shared-lines{width:100%;border-collapse:collapse;margin-top:20px}.shared-lines th,.shared-lines td{text-align:left;padding:12px 8px;border-bottom:1px solid #e5e7eb}.shared-total{margin-top:20px;text-align:right;font-size:22px}.shared-status{display:inline-block;padding:7px 12px;border-radius:999px;font-weight:700;background:#fff3cd;color:#7a5a00}.shared-status.paid{background:#16803c;color:#fff}.error{padding:20px;border-radius:14px;background:#fff0f0;border:1px solid #f0b4b4;color:#8a1c1c}</style></head><body><main class="shared-invoice panel"><div id="invoice"><p>Rechnung wird geladen…</p></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(async()=>{const root=document.getElementById('invoice');const p=new URLSearchParams(location.search);const token=p.get('token');const number=p.get('invoice');const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const money=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(Number(n)||0);if(!token){root.innerHTML='<div class="error"><b>Ungültiger Rechnungslink.</b><br>Es wurde kein Zugriffstoken übergeben.</div>';return}try{const sb=window.supabase.createClient('https://qsyijgvikxmwmhaiulne.supabase.co','sb_publishable_5qeUg0c0T0IyLh8g0cUj6Q_ZJYgZYJ_',{auth:{persistSession:false,autoRefreshToken:false}});let q=sb.from('shared_invoice_access').select('snapshot').eq('token',token).eq('active',true);if(number)q=q.eq('invoice_number',number);const {data,error}=await q.maybeSingle();if(error||!data?.snapshot)throw error||new Error('not found');const s=data.snapshot,inv=s.invoice||{},client=s.client||{},caseData=s.case||{},rec=inv.billing_recipient||{name:'Thorson Donnerfaust',account:'4693'};root.innerHTML=`<div class="shared-head"><div><div class="eyebrow">RECHNUNG</div><h1 class="shared-title">${esc(inv.invoice_number||number||'Rechnung')}</h1><div class="shared-meta">Ausgestellt am ${esc(inv.date||'')}</div></div><span class="shared-status ${inv.status==='Bezahlt'?'paid':''}">${inv.status==='Bezahlt'?'✓ Bezahlt':'Offen'}</span></div><div class="shared-recipient"><b>Rechnungsempfänger</b><br>${esc(rec.name)}<br>Konto-Nr.: ${esc(rec.account)}</div>${client.name?`<p><b>Mandant</b><br>${esc(client.name)}${client.address?`<br>${esc(client.address)}`:''}</p>`:''}${caseData.file_number?`<p><b>Akte</b><br>${esc(caseData.file_number)}${caseData.title?` · ${esc(caseData.title)}`:''}</p>`:''}<table class="shared-lines"><thead><tr><th>Leistung</th><th>Betrag</th></tr></thead><tbody>${(inv.lines||[]).map(x=>`<tr><td>${esc(x.name)}${x.category?`<small style="display:block;color:#667085">${esc(x.category)}</small>`:''}</td><td>${money(x.price)}</td></tr>`).join('')}</tbody></table><div class="shared-total"><b>Gesamt: ${money(inv.amount)}</b></div>`}catch(e){console.error(e);root.innerHTML='<div class="error"><b>Rechnung nicht verfügbar.</b><br>Der Link ist ungültig, abgelaufen oder die Freigabe ist derzeit nicht erreichbar.</div>'}})();
</script></body></html>
