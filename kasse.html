<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kasse – Rechtsanwalt Donnerfaust</title><link rel="stylesheet" href="./style.css?v=11"><style>.finance{max-width:1100px;margin:30px auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px}.card small{display:block;color:#667085;text-transform:uppercase}.card b{font-size:24px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer}.green{background:#16803c;color:#fff}.red{background:#c62828;color:#fff}.dark{background:#111827;color:#fff;text-decoration:none}.row{background:#fff;border:1px solid #ddd;border-left:5px solid #16803c;border-radius:12px;padding:14px;margin:9px 0;display:flex;justify-content:space-between;gap:10px}.row.out{border-left-color:#c62828}.row b.in{color:#16803c}.row b.out{color:#c62828}.del{border:0;background:transparent;text-decoration:underline;cursor:pointer}@media(max-width:700px){.cards{grid-template-columns:1fr}.row{flex-direction:column}}</style></head><body><main class="finance"><p>⚖ KANZLEI / FINANZEN</p><h1>Kassensystem</h1><div id="cards"></div><div class="actions"><button class="btn green" onclick="add('in')">＋ Einzahlung</button><button class="btn red" onclick="add('out')">− Auszahlung</button><a class="btn dark" href="./finanzen.html">Finanzübersicht</a><a class="btn dark" href="./index.html">Kanzlei</a></div><h2>Kassenbuch</h2><div id="list"></div></main><script>const key='donnerfaust_kanzlei_v1',read=()=>JSON.parse(localStorage.getItem(key)||'{}'),save=d=>localStorage.setItem(key,JSON.stringify(d));const money=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n||0);function render(){const d=read();d.cashbook||=[];const inc=d.cashbook.filter(x=>x.kind==='in').reduce((s,x)=>s+Number(x.amount||0),0),out=d.cashbook.filter(x=>x.kind==='out').reduce((s,x)=>s+Number(x.amount||0),0);cards.innerHTML=`<div class="cards"><div class="card"><small>Kanzleivermögen</small><b>${money(inc-out)}</b></div><div class="card"><small>Einzahlungen</small><b style="color:#16803c">${money(inc)}</b></div><div class="card"><small>Auszahlungen</small><b style="color:#c62828">${money(out)}</b></div></div>`;list.innerHTML=d.cashbook.slice().reverse().map(x=>`<div class="row ${x.kind==='out'?'out':''}"><div><b class="${x.kind==='in'?'in':'out'}">${x.kind==='in'?'+':'−'} ${money(x.amount)}</b><div>${String(x.reason||'').replace(/[<>]/g,'')} · ${x.date||''}</div></div><button class="del" onclick="del('${x.id}')">Löschen</button></div>`).join('')||'<p>Noch keine Kassenbewegungen.</p>'}function add(kind){const a=prompt(kind==='in'?'Einzahlung – Betrag (€):':'Auszahlung – Betrag (€):');if(a===null)return;const n=Number(String(a).replace(',','.'));if(!Number.isFinite(n)||n<=0)return alert('Ungültiger Betrag.');const r=prompt('Grund:');if(!r?.trim())return;const d=read();d.cashbook||=[];d.cashbook.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),kind,amount:n,reason:r.trim(),date:new Date().toLocaleString('de-DE'),source:'manual'});save(d);render()}function del(id){if(!confirm('Kassenbuch-Eintrag wirklich löschen?'))return;const d=read();d.cashbook=(d.cashbook||[]).filter(x=>x.id!==id);save(d);render()}render();</script></body></html>
