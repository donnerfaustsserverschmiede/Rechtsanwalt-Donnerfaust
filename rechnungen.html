<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rechnungen – Rechtsanwalt Donnerfaust</title><link rel="stylesheet" href="./style.css?v=11"><style>.finance{max-width:1200px;margin:30px auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:18px}.card small{display:block;color:#667085;text-transform:uppercase}.card b{font-size:24px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.btn{border:0;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer;text-decoration:none}.dark{background:#111827;color:#fff}.table{overflow:auto;background:#fff;border:1px solid #ddd;border-radius:16px}.table table{width:100%;border-collapse:collapse;min-width:760px}.table th,.table td{padding:13px;border-bottom:1px solid #eee;text-align:left;vertical-align:top}.status{border:0;border-radius:999px;padding:6px 10px;cursor:pointer;font-weight:700;background:#fff3cd;color:#7a5a00}.paid{background:#e7f6ec;color:#16803c}.del{border:0;background:transparent;text-decoration:underline;cursor:pointer}.modalback{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:15px;z-index:10}.modal{background:#fff;border-radius:18px;padding:20px;width:min(760px,100%);max-height:90vh;overflow:auto}.modal label{display:block;margin:10px 0;font-weight:700}.modal select{display:block;width:100%;padding:10px;margin-top:5px}.check{display:flex!important;gap:10px;align-items:flex-start;font-weight:400!important}.check input{margin-top:4px}.total{font-size:20px;padding:14px;border:1px solid #ddd;border-radius:12px;margin-top:15px}@media(max-width:700px){.cards{grid-template-columns:1fr}}</style></head><body><main class="finance"><p>⚖ KANZLEI / FINANZEN</p><h1>Gebühren & Rechnungen</h1><div id="cards"></div><div class="actions"><button class="btn dark" onclick="newInvoice()">＋ Rechnung erstellen</button><a class="btn dark" href="./finanzen.html">Finanzübersicht</a><a class="btn dark" href="./kasse.html">💶 Kasse</a><a class="btn dark" href="./index.html">← Kanzlei</a></div><div class="table"><table><thead><tr><th>Rechnung</th><th>Mandant</th><th>Akte</th><th>Leistungen</th><th>Betrag</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const key='donnerfaust_kanzlei_v1',read=()=>JSON.parse(localStorage.getItem(key)||'{}'),save=d=>localStorage.setItem(key,JSON.stringify(d));const money=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n||0);const regular={"Erstberatung / Erstgespräch":1000,"Einfache Rechtsberatung":2500,"Prüfung eines einfachen Falls":3500,"Erstellung eines Schreibens / Antrags":4000,"Außergerichtliche Vertretung":7500,"Umfangreiche außergerichtliche Vertretung":12500,"Vertretung bei Polizei / Vernehmung":7500,"Gerichtliche Vertretung":15000,"Umfangreiches Gerichtsverfahren":20000,"Komplexes Gerichtsverfahren inkl. vollständiger Vorbereitung, Aktenprüfung, Schriftsätzen und Hauptverhandlung":25000},special={"Dringender / kurzfristiger Auftrag":5000,"Zusätzlicher Termin außerhalb der Kanzlei":2500};function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}function render(){const d=read();d.invoices||=[];d.cashbook||=[];const total=d.invoices.reduce((s,i)=>s+Number(i.amount||0),0),paid=d.invoices.filter(i=>i.status==='Bezahlt').reduce((s,i)=>s+Number(i.amount||0),0),open=total-paid;cards.innerHTML=`<div class="cards"><div class="card"><small>Rechnungsvolumen</small><b>${money(total)}</b></div><div class="card"><small>Bezahlt</small><b style="color:#16803c">${money(paid)}</b></div><div class="card"><small>Offen</small><b>${money(open)}</b></div></div>`;rows.innerHTML=d.invoices.slice().reverse().map(i=>{const c=(d.clients||[]).find(x=>x.id===i.client_id),a=(d.cases||[]).find(x=>x.id===i.case_id);return `<tr><td><b>${esc(i.invoice_number)}</b><br><small>${esc(i.date||'')}</small></td><td>${esc(c?.name||'—')}</td><td>${esc(a?.file_number||'—')}</td><td>${(i.lines||[]).map(x=>esc(x.name)).join('<br>')}</td><td><b>${money(i.amount)}</b></td><td><button class="status ${i.status==='Bezahlt'?'paid':''}" onclick="paid('${i.id}')">${esc(i.status||'Offen')}</button></td><td><button class="del" onclick="del('${i.id}')">Löschen</button></td></tr>`}).join('')||'<tr><td colspan="7">Keine Rechnungen vorhanden.</td></tr>'}function newInvoice(){const d=read();if(!(d.clients||[]).length)return alert('Bitte zuerst einen Mandanten anlegen.');const box=document.createElement('div');box.className='modalback';box.innerHTML=`<div class="modal"><h2>Neue Rechnung</h2><label>Mandant<select id="cl">${d.clients.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join('')}</select></label><label>Akte<select id="ca"><option value="">Keine Akte</option>${(d.cases||[]).map(c=>`<option value="${esc(c.id)}">${esc(c.file_number)} · ${esc(c.title)}</option>`).join('')}</select></label><h3>Reguläre Leistungen</h3>${Object.entries(regular).map(([n,p])=>`<label class="check"><input type="checkbox" value="${esc(n)}" data-p="${p}" data-cat="regular"><span>${esc(n)} – ${money(p)}</span></label>`).join('')}<h3>Sonderleistungen</h3>${Object.entries(special).map(([n,p])=>`<label class="check"><input type="checkbox" value="${esc(n)}" data-p="${p}" data-cat="special"><span>${esc(n)} – ${money(p)}</span></label>`).join('')}<div class="total">Rechnungswert: <b id="sum">0,00 €</b></div><div class="actions"><button class="btn dark" id="create">Rechnung erstellen</button><button class="btn" id="cancel">Abbrechen</button></div></div>`;document.body.appendChild(box);const checks=[...box.querySelectorAll('input[type=checkbox]')],sum=box.querySelector('#sum');const calc=()=>sum.textContent=money(checks.filter(x=>x.checked).reduce((s,x)=>s+Number(x.dataset.p),0));checks.forEach(x=>x.onchange=calc);box.querySelector('#cancel').onclick=()=>box.remove();box.querySelector('#create').onclick=()=>{const lines=checks.filter(x=>x.checked).map(x=>({name:x.value,price:Number(x.dataset.p),category:x.dataset.cat==='special'?'Sonderleistung':'Reguläre Leistung'}));if(!lines.length)return alert('Mindestens eine Leistung auswählen.');d.invoices||=[];d.invoices.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),invoice_number:'RE-'+new Date().getFullYear()+'-'+String(d.invoices.length+1).padStart(3,'0'),client_id:box.querySelector('#cl').value,case_id:box.querySelector('#ca').value,lines,amount:lines.reduce((s,x)=>s+x.price,0),date:new Date().toISOString().slice(0,10),status:'Offen'});save(d);box.remove();render()}}function paid(id){const d=read(),i=(d.invoices||[]).find(x=>x.id===id);if(!i||i.status==='Bezahlt')return;if(!confirm(`Rechnung ${i.invoice_number} als bezahlt markieren? ${money(i.amount)} wird als Einzahlung in die Kasse gebucht.`))return;i.status='Bezahlt';d.cashbook||=[];d.cashbook.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2),kind:'in',amount:Number(i.amount)||0,reason:'Zahlung Rechnung '+i.invoice_number,date:new Date().toLocaleString('de-DE'),source:'invoice',invoice_id:i.id});save(d);render()}function del(id){if(!confirm('Rechnung wirklich löschen?'))return;const d=read();d.invoices=(d.invoices||[]).filter(x=>x.id!==id);save(d);render()}render();</script></body></html>
