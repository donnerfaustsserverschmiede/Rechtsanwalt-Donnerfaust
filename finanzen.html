<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Finanzübersicht – Rechtsanwalt Donnerfaust</title><link rel="stylesheet" href="./style.css?v=11"><style>.finance{max-width:1100px;margin:30px auto;padding:20px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #ddd;border-radius:16px;padding:20px}.card small{display:block;color:#667085;text-transform:uppercase}.card b{font-size:25px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0}.btn{display:inline-block;padding:13px 18px;border-radius:12px;text-decoration:none;font-weight:700}.dark{background:#111827;color:#fff}.green{background:#16803c;color:#fff}.red{background:#c62828;color:#fff}@media(max-width:700px){.cards{grid-template-columns:1fr 1fr}}</style></head><body><main class="finance"><p>⚖ KANZLEI / FINANZEN</p><h1>Finanzübersicht</h1><div class="cards" id="cards"></div><div class="actions"><a class="btn green" href="./kasse.html">💶 Kasse</a><a class="btn dark" href="./rechnungen.html">🧾 Rechnungen</a><a class="btn" href="./index.html">← Kanzlei</a></div></main><script>const d=JSON.parse(localStorage.getItem('donnerfaust_kanzlei_v1')||'{}'),c=d.cashbook||[],i=d.invoices||[];const money=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n||0);const inc=c.filter(x=>x.kind==='in').reduce((s,x)=>s+Number(x.amount||0),0),out=c.filter(x=>x.kind==='out').reduce((s,x)=>s+Number(x.amount||0),0),open=i.filter(x=>x.status!=='Bezahlt').reduce((s,x)=>s+Number(x.amount||0),0);cards.innerHTML=`<div class="card"><small>Kanzleivermögen</small><b>${money(inc-out)}</b></div><div class="card"><small>Einzahlungen</small><b style="color:#16803c">${money(inc)}</b></div><div class="card"><small>Auszahlungen</small><b style="color:#c62828">${money(out)}</b></div><div class="card"><small>Offene Rechnungen</small><b>${money(open)}</b></div>`;</script></body></html>
