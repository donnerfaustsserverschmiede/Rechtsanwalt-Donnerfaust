<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><title>Externe Akteneinsicht</title>
<link rel="stylesheet" href="./style.css?v=8">
</head>
<body><main class="main" style="margin-left:0"><section class="content" id="sharedApp"><div class="loading">Aktenansicht wird geladen…</div></section></main>
<script>
(() => {
  const root=document.getElementById("sharedApp");
  const esc=s=>String(s??"").replace(/[&<>\"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
  const dec=s=>{try{s=s.replace(/-/g,"+").replace(/_/g,"/");while(s.length%4)s+="=";const bin=atob(s);const bytes=Uint8Array.from(bin,c=>c.charCodeAt(0));return JSON.parse(new TextDecoder().decode(bytes));}catch{return null;}};
  const data=new URLSearchParams(location.hash.slice(1)).get("data"); const x=dec(data||"");
  if(!x?.case){root.innerHTML='<div class="panel"><h2>⚠ Aktenzugang ungültig</h2><p>Der Freigabelink ist beschädigt oder enthält keine gültige Akte.</p></div>';return;}
  const c=x.case,cl=x.client;
  const field=(k,v)=>`<div class="field"><small>${k}</small><b>${esc(v||"—")}</b></div>`;
  const media=item=>{const t=String(item.type||""); if(t.startsWith("image/")) return `<img src="${esc(item.url)}" alt="${esc(item.name)}" style="max-width:100%;max-height:520px;border-radius:12px;display:block">`; if(t.startsWith("video/")) return `<video src="${esc(item.url)}" controls playsinline preload="metadata" style="max-width:100%;max-height:520px;border-radius:12px;display:block"></video>`; return `<a href="${esc(item.url)}" target="_blank" rel="noopener noreferrer">Datei öffnen</a>`;};
  root.innerHTML=`<div class="intro"><div><div class="eyebrow">EXTERNE AKTENEINSICHT · NUR LESEN</div><h1>${esc(c.title)}</h1><p>Aktenzeichen ${esc(c.file_number)}</p></div></div>
  <div class="grid2"><div class="panel"><div class="panelhead"><b>Stammdaten</b></div>${field("Mandant",cl?.name)}${field("Aktenzeichen",c.file_number)}${field("Status",c.status)}${field("Rechtsgebiet",c.type)}${field("Frist",c.deadline)}${field("Zuständiges Gericht",c.court)}${field("Gegnerseite",c.opponent)}</div><div class="panel"><div class="panelhead"><b>Sachverhalt</b></div><b>Vorfall / Gegenstand</b><p style="white-space:pre-wrap">${esc(c.incident||"—")}</p><b>Hintergrund / Sachverhalt</b><p style="white-space:pre-wrap">${esc(c.background||"—")}</p></div></div>
  <div class="panel"><div class="panelhead"><b>📄 Dokumente</b></div>${(x.documents||[]).map(d=>`<div class="listrow"><b>📄 ${esc(d.name)}</b><small>${esc(d.type||"")}${d.note?" · "+esc(d.note):""}</small></div>`).join("")||'<p class="muted">Keine Dokumente freigegeben.</p>'}</div>
  <div class="panel"><div class="panelhead"><b>📁 Beweise</b></div>${(x.evidence_folders||[]).map(f=>`<div class="panel" style="margin:12px 0"><div class="panelhead"><b>📁 ${esc(f.name)}</b><span>${(f.items||[]).length} Dateien</span></div>${(f.items||[]).map(i=>`<div style="margin:14px 0;padding:12px;border:1px solid #e5e7eb;border-radius:14px"><b>${esc(i.name)}</b><div style="margin-top:10px">${media(i)}</div></div>`).join("")||'<p class="muted">Keine Dateien.</p>'}</div>`).join("")||'<p class="muted">Keine Beweise freigegeben.</p>'}</div>
  <div class="panel"><small class="muted">🔒 Diese Ansicht ist schreibgeschützt. Es besteht kein Zugriff auf die Kanzleiverwaltung oder andere Akten.</small></div>`;
})();
</script></body></html>
