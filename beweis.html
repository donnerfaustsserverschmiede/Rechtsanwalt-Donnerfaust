<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Beweisordner – Rechtsanwalt Donnerfaust</title>
<style>
body{margin:0;background:#f4f6f8;color:#18212f;font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1100px;margin:30px auto;padding:20px}.card{background:#fff;border:1px solid #e2e6eb;border-radius:18px;padding:24px;box-shadow:0 8px 30px #0000000d}.top{display:flex;justify-content:space-between;gap:15px;align-items:center}.brand{font-weight:700}.muted{color:#667085}.error{padding:20px;border:1px solid #f0b4b4;border-radius:12px;background:#fff6f6}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px;margin-top:24px}.item{border:1px solid #e2e6eb;border-radius:14px;overflow:hidden;background:#fafbfc}.media{background:#111;min-height:220px;display:flex;align-items:center;justify-content:center}.media img{display:block;width:100%;height:320px;object-fit:contain}.media video{display:block;width:100%;height:320px;object-fit:contain;background:#111}.info{padding:14px}.download{display:inline-block;margin-top:10px;padding:9px 13px;border-radius:9px;background:#18212f;color:#fff;text-decoration:none}.empty{text-align:center;padding:40px}.count{display:inline-block;padding:5px 9px;border-radius:999px;background:#eef1f5;margin-top:8px}
</style>
</head>
<body><div class="wrap"><div class="card" id="app"><div class="muted">Beweisordner wird geladen…</div></div></div>
<script>
(()=>{
const SUPABASE_URL="https://qsyijgvikxmwmhaiulne.supabase.co";
const SUPABASE_KEY="sb_publishable_5qeUg0c0T0IyLh8g0cUj6Q_ZJYgZYJ_";
const BUCKET="evidence";
const p=new URLSearchParams(location.search),folderId=p.get('folder')||'';const app=document.getElementById('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
if(!folderId){app.innerHTML='<div class="error"><b>Kein Beweisordner angegeben.</b><p class="muted">Dieser Link ist unvollständig.</p></div>';return}
const manifestUrl=`${SUPABASE_URL}/storage/v1/object/public/${BUCKET}/folders/${encodeURIComponent(folderId)}/manifest.json`;
fetch(manifestUrl,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Beweisordner konnte nicht geladen werden.');return r.json()}).then(folder=>{
const items=Array.isArray(folder.items)?folder.items:[];
app.innerHTML=`<div class="top"><div class="brand">⚖ Rechtsanwalt Donnerfaust</div><div class="muted">Externe Beweisansicht</div></div><hr><h1>${esc(folder.name||'Beweisordner')}</h1><span class="count">${items.length} Beweismittel</span>${items.length?`<div class="grid">${items.map((x,i)=>{const type=String(x.type||'').toLowerCase(),url=esc(x.url||'');let media='';if(type.startsWith('image/'))media=`<div class="media"><img src="${url}" alt="${esc(x.name||x.file_name||'Bild')}"></div>`;else if(type.startsWith('video/'))media=`<div class="media"><video src="${url}" controls playsinline preload="metadata"></video></div>`;else media=`<div class="media"><div style="color:#fff;padding:30px">Datei kann nicht direkt angezeigt werden.</div></div>`;return `<article class="item">${media}<div class="info"><b>${esc(x.name||x.file_name||`Beweismittel ${i+1}`)}</b><div class="muted">${esc(x.file_name||'')}</div><a class="download" href="${url}" target="_blank" rel="noopener">Datei öffnen</a></div></article>`}).join('')}</div>`:'<div class="empty"><b>Dieser Beweisordner enthält noch keine Beweismittel.</b></div>'}`;
}).catch(err=>{app.innerHTML=`<div class="error"><b>Beweisordner nicht verfügbar.</b><p class="muted">${esc(err.message||'Unbekannter Fehler')}</p></div>`});
})();
</script></body></html>
